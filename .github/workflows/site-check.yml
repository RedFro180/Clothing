# Runs on every change to the website. A red X on GitHub means: don't publish that version.
name: Site safety check
on:
  push:
    paths: ["site/**", "tools/check_site.js", "tools/customer_runs.js", "tools/abuse_tests.js", "tools/scroll_test.js", "tools/fold_test.js", "tools/screens.js", ".github/workflows/site-check.yml"]
  pull_request:
    paths: ["site/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Settings and files check
        run: node tools/check_site.js
      - name: JavaScript syntax check
        run: for f in site/*.js; do node --check "$f" || exit 1; done
      - name: Install browser
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Abuse tests (bots, spam, tampering, huge orders)
        run: node tools/abuse_tests.js
      - name: Scrolling on 7 screen types (pop-ups, lists, ring, chips)
        run: node tools/scroll_test.js
      - name: Foldables, dual screens and split screen (layout, full order, fold/unfold, hinge)
        run: node tools/fold_test.js
      - name: Scrolling on foldable and split-screen sizes
        run: node tools/scroll_test.js fold
      - name: 50 simulated shoppers (must finish with no page errors)
        run: node tools/customer_runs.js
